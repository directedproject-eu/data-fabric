apiVersion: batch/v1
kind: CronJob
metadata:
  name: geosphere-ingest
spec:
  # every day at 00:30 am
  # -> might be good to increase to every 3 hours
  #    according to the dataset update frequency
  schedule: "30 0 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: "job-geosphere-ingestion"
            image: 52north/directed-geosphere-ingestor:latest
            imagePullPolicy: Always
            env:
            - name: LOGURU_LEVEL
              value: INFO
            - name: BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: bucket
                  key: name
            - name: BUCKET_KEY
              valueFrom:
                secretKeyRef:
                  name: bucket
                  key: key
            - name: BUCKET_SECRET
              valueFrom:
                secretKeyRef:
                  name: bucket
                  key: secret
            - name: BBOX
              value: "48.0,16.0,48.4,16.8"
            - name: PARAMETERS
              value: "rain_acc"
            # command: ["/bin/sh"]
            # args: ["-c", "sleep 600"]
            resources:
              requests:
                memory: 300M
                cpu: 100m
              limits:
                memory: 300M
                cpu: 100m
          restartPolicy: Never
