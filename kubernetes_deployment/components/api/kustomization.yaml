apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: <my-namespace>

resources:
  - deployment.yaml
  - ingress.yaml
  - pvc.yaml
  - service.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    type: generated
  annotations:
    note: generated

configMapGenerator:
- name: api-config
  files:
  - local.config.yml
