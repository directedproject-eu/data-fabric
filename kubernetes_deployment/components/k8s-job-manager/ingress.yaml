apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: job-manager-transport
  namespace: <my-namespace>
spec:
  forwardingTimeouts:
    responseHeaderTimeout: 180s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: job-manager-rewrite
  namespace: <my-namespace>
spec:
  replacePathRegex:
    regex: "^/k8s-jobs(/?)(.*)"
    replacement: "/k8s-jobs/$2"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: k8s-job-manager
  namespace: <my-namespace>
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`<my-host>`) && PathPrefix(`/k8s-jobs`)
    kind: Rule
    services:
    - name: k8s-job-manager
      port: 80
      serversTransport: job-manager-transport
    middlewares:
    # - name: <traefik-ip-whitelist>
    - name: job-manager-rewrite
  tls:
    secretName: <my-tls-secret-name>
