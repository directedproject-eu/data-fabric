apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: <my-namespace>

resources:
- deployment.yaml
- ingress.yaml
- permissions.yaml
- service.yaml
- storage.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    type: generated
  annotations:
    note: generated

configMapGenerator:
  - name: k8s-job-manager-config
    files:
    - local.config.yml
