    visibility: default
    title: Zala Water Damage Events
    description: Zala Water Damage Events
    keywords:
      - Zala
      - Hungary
      - water
      - damage
      - events
      - "water damage events"
    extents:
      spatial:
        bbox: [ 16.3446, 46.2497, 17.5516, 47.0236 ]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: feature
        name: GeoJSON
        data: /pygeoapi/data/collections/water_damage_events.geojson
        crs:
          - http://www.opengis.net/def/crs/OGC/1.3/CRS84
          - http://www.opengis.net/def/crs/EPSG/0/3857
